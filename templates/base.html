<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order to Audit</title>
<style>
 body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f5f7;color:#222}
 header{background:#1f3a5f;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
 header a{color:#fff;text-decoration:none;font-size:14px}
 header form{margin-left:auto}
 main{max-width:900px;margin:0 auto;padding:14px}
 .card{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 table{width:100%;border-collapse:collapse;font-size:14px}
 th,td{padding:6px 8px;border-bottom:1px solid #e3e3e3;text-align:left}
 input,select,textarea,button{font-size:16px;padding:8px;border-radius:6px;border:1px solid #bbb;box-sizing:border-box}
 input[type=number]{width:110px}
 input[type=text],input[type=password],select,textarea{width:100%}
 button{background:#1f3a5f;color:#fff;border:0;cursor:pointer;padding:9px 14px;margin-right:6px}
 button.red{background:#b3261e}
 button.green{background:#2e7d32}
 .msg{padding:10px;border-radius:6px;margin-bottom:10px}
 .msg.success{background:#e1f3e3}
 .msg.error{background:#fde4e2}
 .tag{display:inline-block;padding:2px 8px;border-radius:10px;background:#e8eaf0;font-size:12px}
 .bad{color:#b3261e;font-weight:600}
 .table-wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
 <strong>Order-to-Audit</strong>
 <a href="{% url 'home' %}">Home</a>
 {% if user.is_authenticated %}
 <span style="font-size:13px">{{ user.username }}</span>
 <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button style="padding:4px 10px;font-size:13px">Logout</button></form>
 {% endif %}
</header>
<main>
{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
