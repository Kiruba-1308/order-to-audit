services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderaudit
      POSTGRES_USER: orderaudit
      POSTGRES_PASSWORD: orderaudit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderaudit"]
      interval: 3s
      retries: 15
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_benchmark && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: orderaudit
      POSTGRES_USER: orderaudit
      POSTGRES_PASSWORD: orderaudit
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: